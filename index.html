<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মদিনা এন্টারপ্রাইজ - হিসাব খাতা</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B2420">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="মদিনা এন্টারপ্রাইজ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --sand-bg:#FAF6EC;
    --sand-bg-alt:#F1E8D4;
    --ink:#2B2420;
    --ink-soft:#6B5F4F;
    --gold:#B8863B;
    --gold-deep:#8F6526;
    --gold-soft:#F1E1BC;
    --river:#3F6B52;
    --river-soft:#E3EEE6;
    --rust:#B5502E;
    --rust-soft:#F6E1D6;
    --line:#E4D7B8;
    --card:#FFFFFF;
    --shadow: 0 2px 10px rgba(43,36,32,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 30%, rgba(184,134,59,0.05) 0, transparent 2px),
      radial-gradient(circle at 60% 70%, rgba(184,134,59,0.05) 0, transparent 2px),
      radial-gradient(circle at 85% 20%, rgba(184,134,59,0.04) 0, transparent 2px),
      var(--sand-bg);
    background-size: 26px 26px, 34px 34px, 40px 40px, auto;
    color:var(--ink);
    font-family:'Hind Siliguri', sans-serif;
    min-height:100vh;
  }
  .num{font-family:'JetBrains Mono', monospace; font-variant-numeric: tabular-nums;}
  header.top{
    background:linear-gradient(180deg, var(--ink) 0%, #3a2f27 100%);
    color:#F5EEDD;
    padding:22px 20px 0 20px;
    position:relative;
  }
  .brandRow{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; max-width:1100px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:44px;height:44px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 60%, var(--gold-deep) 100%);
    flex:none;
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.25);
  }
  .brand h1{font-family:'Tiro Bangla', serif; font-size:24px; margin:0; letter-spacing:.3px;}
  .brand p{margin:2px 0 0; font-size:12.5px; color:#D8CBAE;}
  nav.tabs{display:flex; gap:2px; max-width:1100px; margin:16px auto 0; overflow-x:auto;}
  nav.tabs button{
    background:none;border:none;color:#D8CBAE;
    font-family:'Hind Siliguri',sans-serif; font-size:14.5px; font-weight:600;
    padding:12px 16px; cursor:pointer; white-space:nowrap;
    border-bottom:3px solid transparent;
    transition:.15s;
  }
  nav.tabs button:hover{color:#F5EEDD;}
  nav.tabs button.active{color:#F5EEDD; border-bottom-color:var(--gold);}
  .wave{display:block; width:100%; height:16px; margin-top:14px;}
  main{max-width:1100px; margin:0 auto; padding:24px 20px 80px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; box-shadow:var(--shadow);}
  .grid{display:grid; gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:820px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} }
  .stat{padding:16px 18px;}
  .stat .lbl{font-size:12.5px; color:var(--ink-soft); font-weight:600;}
  .stat .val{font-size:23px; font-weight:700; margin-top:6px;}
  .stat.gold{border-left:4px solid var(--gold);}
  .stat.river{border-left:4px solid var(--river);}
  .stat.rust{border-left:4px solid var(--rust);}
  .stat.ink{border-left:4px solid var(--ink);}
  h2.section-title{font-family:'Tiro Bangla', serif; font-size:21px; margin:0 0 14px;}
  section{display:none;}
  section.active{display:block;}
  .formGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px 16px;}
  @media(max-width:760px){.formGrid{grid-template-columns:repeat(2,1fr);}}
  label{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  input[type=text], input[type=date], input[type=number], input[type=email], input[type=password], select, textarea{
    width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:8px;
    font-family:'Hind Siliguri',sans-serif; font-size:14.5px; background:#FFFDF8; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--gold);}
  .btn{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; border:none; border-radius:9px;
    padding:10px 18px; font-family:'Hind Siliguri',sans-serif; font-weight:700; font-size:14px;
  }
  .btn-primary{background:var(--ink); color:#F5EEDD;}
  .btn-primary:hover{background:#463A30;}
  .btn-outline{background:#fff; border:1.5px solid var(--line); color:var(--ink);}
  .btn-outline:hover{border-color:var(--gold);}
  .rowGap{display:flex; gap:10px; flex-wrap:wrap;}

  /* AUTH STYLES */
  #authScreen{
    position:fixed; inset:0; z-index:1200; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 20% 30%, rgba(184,134,59,0.08) 0, transparent 2px), var(--sand-bg);
    padding:20px;
  }
  #authScreen.hide, #appRoot.hide{display:none;}
  .authCard{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:30px 26px; width:100%; max-width:400px; box-shadow:0 8px 30px rgba(43,36,32,.12);
  }
  .authBrand{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .authBrand .brand-mark{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 60%, var(--gold-deep) 100%); flex:none;}
  .authBrand h1{font-family:'Tiro Bangla', serif; font-size:20px; margin:0; color:var(--ink);}
  .authBrand p{margin:2px 0 0; font-size:12px; color:var(--ink-soft);}
  .authTabs{display:flex; gap:6px; margin-bottom:18px; background:var(--sand-bg-alt); border-radius:10px; padding:4px;}
  .authTabs button{
    flex:1; padding:9px; border:none; border-radius:8px; background:transparent; cursor:pointer;
    font-family:'Hind Siliguri',sans-serif; font-weight:700; font-size:13.5px; color:var(--ink-soft);
  }
  .authTabs button.on{background:#fff; color:var(--ink); box-shadow:var(--shadow);}
  .authForm{display:none; flex-direction:column; gap:13px;}
  .authForm.on{display:flex !important;}
  .pwdWrap{position:relative;}
  .pwdWrap input{padding-right:40px;}
  .pwdToggle{
    position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none;
    cursor:pointer; font-size:16px; padding:6px; color:var(--ink-soft);
  }
  .authErr, .authMsg{
    display:none; border-radius:8px; padding:9px 12px; font-size:13px; font-weight:600; margin-bottom: 10px;
  }
  .authErr{background:var(--rust-soft); color:var(--rust);}
  .authMsg{background:var(--river-soft); color:var(--river);}
  .authErr.show, .authMsg.show{display:block;}
  .authLink{background:none; border:none; color:var(--gold-deep); font-weight:700; font-size:12.5px; cursor:pointer; padding:0;}
  .userChip{display:flex; align-items:center; gap:10px;}
  .userChip .who{font-size:12px; color:#D8CBAE; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .logoutBtn{
    background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.2); color:#F5EEDD;
    border-radius:8px; padding:7px 12px; font-family:'Hind Siliguri',sans-serif; font-weight:600; font-size:12.5px; cursor:pointer;
  }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen">
  <div class="authCard">
    <div class="authBrand">
      <div class="brand-mark"></div>
      <div>
        <h1>মদিনা এন্টারপ্রাইজ</h1>
        <p>হিসাব খাতা — ব্যবহার করতে লগইন করুন</p>
      </div>
    </div>

    <div class="authTabs" id="authTabs">
      <button type="button" id="tabBtnLogin" data-authtab="login" class="on">লগইন</button>
      <button type="button" id="tabBtnRegister" data-authtab="register">রেজিস্ট্রেশন</button>
    </div>

    <div class="authErr" id="authErr"></div>
    <div class="authMsg" id="authMsg"></div>

    <!-- LOGIN FORM -->
    <form class="authForm on" id="loginForm">
      <div>
        <label>ইমেইল বা মোবাইল নাম্বার</label>
        <input type="text" id="li-id" placeholder="ইমেইল বা মোবাইল নাম্বার লিখুন" required autocomplete="username">
      </div>
      <div>
        <label>পাসওয়ার্ড</label>
        <div class="pwdWrap">
          <input type="password" id="li-pass" placeholder="পাসওয়ার্ড লিখুন" required autocomplete="current-password">
          <button type="button" class="pwdToggle" data-toggle="li-pass">👁</button>
        </div>
      </div>
      <div class="rowGap" style="justify-content:space-between; align-items:center;">
        <button type="button" class="authLink" id="forgotBtn">পাসওয়ার্ড ভুলে গেছেন?</button>
      </div>
      <button type="submit" class="btn btn-primary" style="justify-content:center;" id="loginBtn">প্রবেশ করুন</button>
    </form>

    <!-- REGISTER FORM -->
    <form class="authForm" id="registerForm">
      <div>
        <label>ইমেইল বা মোবাইল নাম্বার</label>
        <input type="text" id="re-id" placeholder="আপনার ইমেইল বা মোবাইল নাম্বার" required autocomplete="username">
      </div>
      <div>
        <label>পাসওয়ার্ড</label>
        <div class="pwdWrap">
          <input type="password" id="re-pass" placeholder="কমপক্ষে ৬ ডিজিট/অক্ষর" required minlength="6" autocomplete="new-password">
          <button type="button" class="pwdToggle" data-toggle="re-pass">👁</button>
        </div>
      </div>
      <div>
        <label>পাসওয়ার্ড নিশ্চিত করুন (Confirm Password)</label>
        <div class="pwdWrap">
          <input type="password" id="re-pass2" placeholder="পাসওয়ার্ড পুনরায় লিখুন" required minlength="6" autocomplete="new-password">
          <button type="button" class="pwdToggle" data-toggle="re-pass2">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="justify-content:center;" id="registerBtn">একাউন্ট তৈরি করুন</button>
    </form>

    <!-- RESET PASSWORD FORM -->
    <form class="authForm" id="resetForm">
      <p style="margin:0 0 10px; font-size:13px; color:var(--ink-soft);">আপনার একাউন্টের ইমেইলটি লিখুন — পাসওয়ার্ড রিসেট করার লিংক পাঠিয়ে দেওয়া হবে।</p>
      <div>
        <label>ইমেইল</label>
        <input type="email" id="rs-email" placeholder="আপনার ইমেইল লিখুন" required autocomplete="username">
      </div>
      <button type="submit" class="btn btn-primary" style="justify-content:center; margin-top:10px;" id="resetBtn">রিসেট লিংক পাঠান</button>
      <button type="button" class="authLink" id="backToLoginBtn" style="margin-top:12px; text-align:center;">← লগইনে ফিরে যান</button>
    </form>
  </div>
</div>

<!-- MAIN APP -->
<div id="appRoot" class="hide">
  <header class="top">
    <div class="brandRow">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <h1 id="brandName">মদিনা এন্টারপ্রাইজ</h1>
          <p id="brandSub">ক্রয় • বিক্রয় • খরচ • লাভ-ক্ষতি</p>
        </div>
      </div>
      <div class="userChip">
        <span class="who" id="whoLabel"></span>
        <button class="logoutBtn" id="logoutBtn" onclick="app.logout()">লগআউট</button>
      </div>
    </div>
  </header>

  <main>
    <div class="card">
      <h2>স্বাগতম! আপনি সফলভাবে লগইন করেছেন।</h2>
    </div>
  </main>
</div>

<script>
// =====================================================================
// Firebase Config
// =====================================================================
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

// Initialize Firebase if config is present
if(firebaseConfig.apiKey !== "YOUR_API_KEY") {
  firebase.initializeApp(firebaseConfig);
}

const app = {
  currentUser: null,

  init(){
    this.bindAuthUI();
    
    if(typeof firebase !== 'undefined' && firebase.auth){
      firebase.auth().onAuthStateChanged((user)=>{
        if(user){
          app.currentUser = user;
          document.getElementById('authScreen').classList.add('hide');
          document.getElementById('appRoot').classList.remove('hide');
          document.getElementById('whoLabel').textContent = user.email || user.phoneNumber || '';
        } else {
          app.currentUser = null;
          document.getElementById('appRoot').classList.add('hide');
          document.getElementById('authScreen').classList.remove('hide');
        }
      });
    }
  },

  bindAuthUI(){
    document.getElementById('tabBtnLogin').addEventListener('click', ()=>app.switchAuthTab('login'));
    document.getElementById('tabBtnRegister').addEventListener('click', ()=>app.switchAuthTab('register'));

    document.querySelectorAll('.pwdToggle').forEach(b=>{
      b.addEventListener('click', (e)=>{
        e.preventDefault();
        const inp = document.getElementById(b.dataset.toggle);
        const show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        b.textContent = show ? '🙈' : '👁';
      });
    });

    document.getElementById('loginForm').addEventListener('submit', app.handleLogin);
    document.getElementById('registerForm').addEventListener('submit', app.handleRegister);
    document.getElementById('resetForm').addEventListener('submit', app.handleReset);
    document.getElementById('forgotBtn').addEventListener('click', ()=>app.switchAuthTab('reset'));
    document.getElementById('backToLoginBtn').addEventListener('click', ()=>app.switchAuthTab('login'));
  },

  switchAuthTab(tab){
    app.clearAuthMsgs();
    document.querySelectorAll('.authForm').forEach(f=>f.classList.remove('on'));
    
    if(tab === 'login') {
      document.getElementById('loginForm').classList.add('on');
    } else if(tab === 'register') {
      document.getElementById('registerForm').classList.add('on');
    } else if(tab === 'reset') {
      document.getElementById('resetForm').classList.add('on');
    }

    document.querySelectorAll('#authTabs button').forEach(b=>{
      b.classList.toggle('on', b.dataset.authtab === tab);
    });
    
    document.getElementById('authTabs').style.display = (tab === 'reset') ? 'none' : 'flex';
  },

  showAuthErr(msg){
    const e = document.getElementById('authErr'); e.textContent = msg; e.classList.add('show');
  },
  showAuthMsg(msg){
    const m = document.getElementById('authMsg'); m.textContent = msg; m.classList.add('show');
  },
  clearAuthMsgs(){
    document.getElementById('authErr').classList.remove('show');
    document.getElementById('authMsg').classList.remove('show');
  },

  formatEmail(id){
    if(!id.includes('@')) return id + "@madina.com";
    return id;
  },

  async handleLogin(e){
    e.preventDefault(); app.clearAuthMsgs();
    const id = document.getElementById('li-id').value.trim();
    const pass = document.getElementById('li-pass').value;
    try{
      await firebase.auth().signInWithEmailAndPassword(app.formatEmail(id), pass);
    }catch(err){ app.showAuthErr("ইমেইল/মোবাইল বা পাসওয়ার্ড ভুল হয়েছে"); }
  },

  async handleRegister(e){
    e.preventDefault(); app.clearAuthMsgs();
    const id = document.getElementById('re-id').value.trim();
    const pass = document.getElementById('re-pass').value;
    const pass2 = document.getElementById('re-pass2').value;

    if(pass !== pass2){
      app.showAuthErr("দুই পাসওয়ার্ড এক নয়!"); return;
    }
    try{
      await firebase.auth().createUserWithEmailAndPassword(app.formatEmail(id), pass);
      app.showAuthMsg("একাউন্ট সফলভাবে তৈরি হয়েছে!");
    }catch(err){ app.showAuthErr(err.message); }
  },

  async handleReset(e){
    e.preventDefault(); app.clearAuthMsgs();
    const email = document.getElementById('rs-email').value.trim();
    try{
      await firebase.auth().sendPasswordResetEmail(email);
      app.showAuthMsg("আপনার ইমেইলে পাসওয়ার্ড রিসেট লিংক পাঠানো হয়েছে।");
    }catch(err){ app.showAuthErr("ইমেইলটি সঠিক নয় বা পাওয়া যায়নি।"); }
  },

  logout(){ 
    if(firebase.auth()) firebase.auth().signOut(); 
  }
};

// Ensure DOM is fully loaded
document.addEventListener('DOMContentLoaded', ()=>{
  app.init();
});
</script>
</body>
</html>
