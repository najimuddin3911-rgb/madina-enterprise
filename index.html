<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মদিনা এন্টারপ্রাইজ - হিসাব খাতা</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B2420">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="মদিনা এন্টারপ্রাইজ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --sand-bg:#FAF6EC;
    --sand-bg-alt:#F1E8D4;
    --ink:#2B2420;
    --ink-soft:#6B5F4F;
    --gold:#B8863B;
    --gold-deep:#8F6526;
    --gold-soft:#F1E1BC;
    --river:#3F6B52;
    --river-soft:#E3EEE6;
    --rust:#B5502E;
    --rust-soft:#F6E1D6;
    --line:#E4D7B8;
    --card:#FFFFFF;
    --shadow: 0 2px 10px rgba(43,36,32,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 30%, rgba(184,134,59,0.05) 0, transparent 2px),
      radial-gradient(circle at 60% 70%, rgba(184,134,59,0.05) 0, transparent 2px),
      radial-gradient(circle at 85% 20%, rgba(184,134,59,0.04) 0, transparent 2px),
      var(--sand-bg);
    background-size: 26px 26px, 34px 34px, 40px 40px, auto;
    color:var(--ink);
    font-family:'Hind Siliguri', sans-serif;
    min-height:100vh;
  }
  .num{font-family:'JetBrains Mono', monospace; font-variant-numeric: tabular-nums;}
  header.top{
    background:linear-gradient(180deg, var(--ink) 0%, #3a2f27 100%);
    color:#F5EEDD;
    padding:22px 20px 0 20px;
    position:relative;
  }
  .brandRow{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; max-width:1100px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:44px;height:44px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 60%, var(--gold-deep) 100%);
    flex:none;
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.25);
  }
  .brand h1{font-family:'Tiro Bangla', serif; font-size:24px; margin:0; letter-spacing:.3px;}
  .brand p{margin:2px 0 0; font-size:12.5px; color:#D8CBAE;}
  nav.tabs{display:flex; gap:2px; max-width:1100px; margin:16px auto 0; overflow-x:auto;}
  nav.tabs button{
    background:none;border:none;color:#D8CBAE;
    font-family:'Hind Siliguri',sans-serif; font-size:14.5px; font-weight:600;
    padding:12px 16px; cursor:pointer; white-space:nowrap;
    border-bottom:3px solid transparent;
    transition:.15s;
  }
  nav.tabs button:hover{color:#F5EEDD;}
  nav.tabs button.active{color:#F5EEDD; border-bottom-color:var(--gold);}
  .wave{display:block; width:100%; height:16px; margin-top:14px;}
  main{max-width:1100px; margin:0 auto; padding:24px 20px 80px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; box-shadow:var(--shadow);}
  .grid{display:grid; gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:820px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} }
  .stat{padding:16px 18px;}
  .stat .lbl{font-size:12.5px; color:var(--ink-soft); font-weight:600;}
  .stat .val{font-size:23px; font-weight:700; margin-top:6px;}
  .stat.gold{border-left:4px solid var(--gold);}
  .stat.river{border-left:4px solid var(--river);}
  .stat.rust{border-left:4px solid var(--rust);}
  .stat.ink{border-left:4px solid var(--ink);}
  h2.section-title{font-family:'Tiro Bangla', serif; font-size:21px; margin:0 0 14px;}
  section{display:none;}
  section.active{display:block;}
  .formGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px 16px;}
  @media(max-width:760px){.formGrid{grid-template-columns:repeat(2,1fr);}}
  label{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  input[type=text], input[type=date], input[type=number], input[type=email], input[type=password], select, textarea{
    width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:8px;
    font-family:'Hind Siliguri',sans-serif; font-size:14.5px; background:#FFFDF8; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--gold);}
  .typeToggle{display:flex; gap:8px; margin-bottom:16px;}
  .typeToggle button{
    flex:1; padding:11px; border-radius:10px; border:2px solid var(--line); background:#fff;
    font-family:'Hind Siliguri',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer; color:var(--ink-soft);
  }
  .typeToggle button.on.buy{border-color:var(--river); color:var(--river); background:var(--river-soft);}
  .typeToggle button.on.sell{border-color:var(--gold-deep); color:var(--gold-deep); background:var(--gold-soft);}
  .typeToggle button.on.expense{border-color:var(--rust); color:var(--rust); background:var(--rust-soft);}
  .typeToggle button.on.duein{border-color:#2E7D46; color:#2E7D46; background:#E4F3E8;}
  .typeToggle button.on.dueout{border-color:#8A5A2B; color:#8A5A2B; background:#F3E7D6;}
  .btn{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; border:none; border-radius:9px;
    padding:10px 18px; font-family:'Hind Siliguri',sans-serif; font-weight:700; font-size:14px;
  }
  .btn-primary{background:var(--ink); color:#F5EEDD;}
  .btn-primary:hover{background:#463A30;}
  .btn-outline{background:#fff; border:1.5px solid var(--line); color:var(--ink);}
  .btn-outline:hover{border-color:var(--gold);}
  .btn-ghost{background:transparent; color:var(--ink-soft); padding:8px 10px;}
  .btn-danger{color:var(--rust);}
  .btn-sm{padding:6px 10px; font-size:12.5px; border-radius:7px;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-soft);
    padding:9px 8px; border-bottom:2px solid var(--line); white-space:nowrap;
  }
  tbody td{padding:9px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
  tbody tr:hover{background:var(--sand-bg-alt);}
  .badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:700;}
  .badge.buy{background:var(--river-soft); color:var(--river);}
  .badge.sell{background:var(--gold-soft); color:var(--gold-deep);}
  .badge.expense{background:var(--rust-soft); color:var(--rust);}
  .badge.due-in{background:#E4F3E8; color:#2E7D46;}
  .badge.due-out{background:#F3E7D6; color:#8A5A2B;}
  .tableWrap{overflow-x:auto; margin-top:14px;}
  .filterBar{display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin-bottom:6px;}
  .filterBar > div{min-width:130px;}
  .presetRow{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .presetRow button{
    padding:8px 14px; border-radius:20px; border:1.5px solid var(--line); background:#fff; cursor:pointer;
    font-family:'Hind Siliguri',sans-serif; font-weight:600; font-size:13px; color:var(--ink-soft);
  }
  .presetRow button.on{border-color:var(--gold); color:var(--gold-deep); background:var(--gold-soft);}
  .empty{text-align:center; padding:40px 10px; color:var(--ink-soft);}
  .empty .big{font-size:34px; margin-bottom:6px;}
  .stockBar{height:12px; border-radius:8px; background:var(--sand-bg-alt); overflow:hidden; margin-top:8px; display:flex;}
  .stockBar .in{background:linear-gradient(90deg, var(--river), #5C8F72);}
  .stockBar .out{background:linear-gradient(90deg, var(--gold), var(--gold-deep));}
  .flexRow{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .muted{color:var(--ink-soft); font-size:13px;}
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#F5EEDD; padding:11px 20px; border-radius:30px; font-size:13.5px;
    box-shadow:0 6px 20px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:.25s; z-index:999;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
  #invoicePreview{margin-top:20px;}
  .invoiceDoc{background:#fff; border:1px solid var(--line); border-radius:10px; padding:26px;}
  .invoiceDoc h3{font-family:'Tiro Bangla',serif; font-size:22px; margin:0;}
  .invoiceHead{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:16px;}
  .invoiceTotals{margin-top:14px; display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  @media(max-width:700px){.invoiceTotals{grid-template-columns:repeat(2,1fr);}}
  .invoiceTotals div{background:var(--sand-bg-alt); border-radius:8px; padding:10px 12px;}
  .invoiceTotals .lbl{font-size:11.5px; color:var(--ink-soft); font-weight:700;}
  .invoiceTotals .val{font-size:16px; font-weight:700; margin-top:3px;}
  .modalBg{position:fixed; inset:0; background:rgba(43,36,32,.45); display:none; align-items:center; justify-content:center; z-index:900; padding:16px;}
  .modalBg.show{display:flex;}
  .modalCard{background:#fff; border-radius:14px; padding:22px; max-width:420px; width:100%;}
  .rowGap{display:flex; gap:10px; flex-wrap:wrap;}

  /* AUTH STYLES */
  #authScreen{
    position:fixed; inset:0; z-index:1200; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 20% 30%, rgba(184,134,59,0.08) 0, transparent 2px), var(--sand-bg);
    padding:20px;
  }
  #authScreen.hide, #appRoot.hide{display:none;}
  .authCard{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:30px 26px; width:100%; max-width:400px; box-shadow:0 8px 30px rgba(43,36,32,.12);
  }
  .authBrand{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .authBrand .brand-mark{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 60%, var(--gold-deep) 100%); flex:none;}
  .authBrand h1{font-family:'Tiro Bangla', serif; font-size:20px; margin:0; color:var(--ink);}
  .authBrand p{margin:2px 0 0; font-size:12px; color:var(--ink-soft);}
  .authTabs{display:flex; gap:6px; margin-bottom:18px; background:var(--sand-bg-alt); border-radius:10px; padding:4px;}
  .authTabs button{
    flex:1; padding:9px; border:none; border-radius:8px; background:transparent; cursor:pointer;
    font-family:'Hind Siliguri',sans-serif; font-weight:700; font-size:13.5px; color:var(--ink-soft);
  }
  .authTabs button.on{background:#fff; color:var(--ink); box-shadow:var(--shadow);}
  .authForm{display:none; flex-direction:column; gap:13px;}
  .authForm.on{display:flex;}
  .pwdWrap{position:relative;}
  .pwdWrap input{padding-right:40px;}
  .pwdToggle{
    position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none;
    cursor:pointer; font-size:16px; padding:6px; color:var(--ink-soft);
  }
  .authErr, .authMsg{
    display:none; border-radius:8px; padding:9px 12px; font-size:13px; font-weight:600;
  }
  .authErr{background:var(--rust-soft); color:var(--rust);}
  .authMsg{background:var(--river-soft); color:var(--river);}
  .authErr.show, .authMsg.show{display:block;}
  .authLink{background:none; border:none; color:var(--gold-deep); font-weight:700; font-size:12.5px; cursor:pointer; padding:0;}
  .userChip{display:flex; align-items:center; gap:10px;}
  .userChip .who{font-size:12px; color:#D8CBAE; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .logoutBtn{
    background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.2); color:#F5EEDD;
    border-radius:8px; padding:7px 12px; font-family:'Hind Siliguri',sans-serif; font-weight:600; font-size:12.5px; cursor:pointer;
  }
  @media print{
    body *{visibility:hidden;}
    #invoicePreview, #invoicePreview *{visibility:visible;}
    #invoicePreview{position:absolute; left:0; top:0; width:100%; margin:0;}
    .noPrint{display:none !important;}
  }
</style>
</head>
<body>

<div id="authScreen">
  <div class="authCard">
    <div class="authBrand">
      <div class="brand-mark"></div>
      <div>
        <h1>মদিনা এন্টারপ্রাইজ</h1>
        <p>হিসাব খাতা — ব্যবহার করতে লগইন করুন</p>
      </div>
    </div>

    <div class="authTabs" id="authTabs">
      <button type="button" data-authtab="login" class="on">লগইন</button>
      <button type="button" data-authtab="register">রেজিস্ট্রেশন</button>
    </div>

    <div class="authErr" id="authErr"></div>
    <div class="authMsg" id="authMsg"></div>

    <form class="authForm on" id="loginForm">
      <div>
        <label>ইমেইল বা মোবাইল নাম্বার</label>
        <input type="text" id="li-id" placeholder="ইমেইল বা মোবাইল নাম্বার লিখুন" required autocomplete="username">
      </div>
      <div>
        <label>পাসওয়ার্ড</label>
        <div class="pwdWrap">
          <input type="password" id="li-pass" placeholder="পাসওয়ার্ড লিখুন" required autocomplete="current-password">
          <button type="button" class="pwdToggle" data-toggle="li-pass">👁</button>
        </div>
      </div>
      <div class="rowGap" style="justify-content:space-between; align-items:center;">
        <button type="button" class="authLink" id="forgotBtn">পাসওয়ার্ড ভুলে গেছেন?</button>
      </div>
      <button type="submit" class="btn btn-primary" style="justify-content:center;" id="loginBtn">প্রবেশ করুন</button>
    </form>

    <form class="authForm" id="registerForm">
      <div>
        <label>ইমেইল বা মোবাইল নাম্বার</label>
        <input type="text" id="re-id" placeholder="আপনার ইমেইল বা মোবাইল নাম্বার" required autocomplete="username">
      </div>
      <div>
        <label>পাসওয়ার্ড</label>
        <div class="pwdWrap">
          <input type="password" id="re-pass" placeholder="কমপক্ষে ৬ ডিজিট/অক্ষর" required minlength="6" autocomplete="new-password">
          <button type="button" class="pwdToggle" data-toggle="re-pass">👁</button>
        </div>
      </div>
      <div>
        <label>পাসওয়ার্ড নিশ্চিত করুন (Confirm Password)</label>
        <div class="pwdWrap">
          <input type="password" id="re-pass2" placeholder="পাসওয়ার্ড পুনরায় লিখুন" required minlength="6" autocomplete="new-password">
          <button type="button" class="pwdToggle" data-toggle="re-pass2">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="justify-content:center;" id="registerBtn">একাউন্ট তৈরি করুন</button>
    </form>

    <form class="authForm" id="resetForm">
      <p class="muted" style="margin:0;">আপনার একাউন্টের ইমেইলটি লিখুন — পাসওয়ার্ড রিসেট করার লিংক পাঠিয়ে দেওয়া হবে।</p>
      <div>
        <label>ইমেইল</label>
        <input type="email" id="rs-email" placeholder="আপনার ইমেইল লিখুন" required autocomplete="username">
